## installation of Monitoring Tools (containers only: Portainer, Prometheus, Grafana)
---
- hosts: sflow_machine
  become: yes
  become_method: sudo
  become_user: root
  tasks:
    - name: Update package lists
      apt:
        update_cache: yes

    - name: Get home directory of the user
      shell: "getent passwd {{ ansible_user }} | cut -d: -f6"
      register: user_home

    - name: Print home directory
      debug:
        var: user_home.stdout

    - name: Install required packages (docker basics)
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - ca-certificates
        - gnupg
        - lsb-release
        - software-properties-common
        - python3
        - python3-pip

    - name: Install Docker dependencies
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - software-properties-common
        - lsb-release

    - name: Create directory for Docker keyring
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: Add Docker GPG key (legacy)
      shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -

    - name: Add Docker repository
      lineinfile:
        path: /etc/apt/sources.list.d/docker.list
        line: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        create: yes

    - name: Update package lists again
      apt:
        update_cache: yes

    - name: Install Docker packages
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started

    - name: Install Portainer
      shell: |
        sudo docker rm -f portainer || true
        sudo docker run -d -p 8000:8000 -p 9443:9443 --name portainer --restart=always \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v portainer_data:/data \
          portainer/portainer-ce:2.9.3

    - name: Create a data directory
      file:
        path: "{{ user_home.stdout }}/data"
        state: directory

    - name: Create prometheus.yml file
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ user_home.stdout }}/prometheus.yml"

    - name: Install prometheus as a container
      shell: |
        sudo docker rm -f prometheus-sflow || true
        sudo docker run -d --user root --name prometheus-sflow --rm \
          -v {{ user_home.stdout }}/data:/prometheus \
          -v {{ user_home.stdout }}/prometheus.yml:/etc/prometheus/prometheus.yml \
          -p 9090:9090 prom/prometheus

    - name: Install grafana as a container
      shell: |
        sudo docker rm -f grafana || true
        sudo docker run -d -p 3000:3000 --name=grafana grafana/grafana-oss
